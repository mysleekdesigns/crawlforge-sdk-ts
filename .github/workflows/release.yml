name: Release

# Publishes crawlforge-sdk to npm when a `v*` tag is pushed, through npm's
# trusted publishing (GitHub Actions OIDC): no NPM_TOKEN secret anywhere. The
# package's settings on npmjs.com must list this repository and this file
# (`release.yml`) as a trusted publisher, with `npm publish` allowed.
# Provenance attestations are generated automatically on that path.
#
# npm 11.5.1 or later is needed for the OIDC exchange; Node 24 bundles it.

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Regenerate from the spec
        run: npm run generate
      - name: Generated files are fresh
        run: git diff --exit-code -- src/generated src/index.ts README.md openapi.json
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # A version that is already on the registry (for example a first release
      # published from a maintainer's machine so the trusted publisher could be
      # configured) is not an error: the tag still marks it, nothing is re-sent.
      - name: Already published?
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # npm logs a refused OIDC token exchange only at verbose level and then
      # publishes unauthenticated, which the registry answers with a bare 404;
      # verbose output is what turns that 404 into the exchange's reason.
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NPM_CONFIG_LOGLEVEL: verbose
