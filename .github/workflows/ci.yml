name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # The generated files are committed; regenerating them must be a no-op,
      # otherwise openapi.json moved without `npm run generate`.
      - name: Regenerate from the spec
        run: npm run generate
      - name: Generated files are fresh
        run: git diff --exit-code -- src/generated src/index.ts README.md openapi.json
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack (dry run)
        run: npm pack --dry-run
